services:
  reddit-fadervittigheder:
    build: .
    container_name: reddit-fadervittigheder
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-18080}:8080"
    environment:
      SUBREDDIT: fadervittigheder
      FETCH_LIMIT: "100"
      FETCH_INTERVAL_SECONDS: "86400"
      USER_AGENT: "dada-base-reddit-scraper/1.0 by local homelab"
    volumes:
      - ./data:/data:z
